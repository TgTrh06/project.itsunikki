services:
  - type: web
    name: itsunikki-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build --workspace=@itsunikki/api
    startCommand: node apps/api/dist/src/main.js
    healthCheckPath: /v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: WEB_ORIGIN
        sync: false
