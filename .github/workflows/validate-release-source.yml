name: Validate Release Source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Require develop promotion or named emergency hotfix
        shell: bash
        run: |
          source_branch="${{ github.head_ref }}"
          if [[ "$source_branch" == "develop" || "$source_branch" == hotfix/* ]]; then
            exit 0
          fi
          echo "Production pull requests must originate from develop or an approved hotfix/* branch."
          exit 1
